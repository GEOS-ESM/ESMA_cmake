version: 2.1

# Anchors in case we need to override the defaults from the orb
#baselibs_version: &baselibs_version v8.32.0
#bcs_version: &bcs_version v12.0.0

orbs:
  ci: geos-esm/circleci-tools@dev:56163250fc651c98a2ae2229a2cf78d2958eafdd

workflows:
  build-test:
    jobs:
      # Build GEOSgcm
      - ci/build:
          name: build-GEOSgcm-on-<< matrix.compiler >>
          context:
            - docker-hub-creds
          matrix:
            parameters:
              compiler: [gfortran, ifort]
          repo: GEOSgcm
          checkout_fixture: true
          mepodevelop: true
          persist_workspace: true # Needs to be true to run fv3/gcm experiment, costs extra

      # Run AMIP GCM (1 hour, no ExtData)
      - ci/run_gcm:
          name: run-GCM-on-<< matrix.compiler >>
          context:
            - docker-hub-creds
          matrix:
            parameters:
              compiler: [gfortran, ifort]
          requires:
            - build-GEOSgcm-on-<< matrix.compiler >>
          repo: GEOSgcm
          #baselibs_version: *baselibs_version
          #bcs_version: *bcs_version

      # Run Coupled GCM (1 hour, no ExtData)
      - ci/run_gcm:
          name: run-coupled-GCM-on-<< matrix.compiler >>
          context:
            - docker-hub-creds
          matrix:
            parameters:
              compiler: [ifort]
              # There seems to be an issue with gfortran, mom6, and GNU
              # Also ifx doesn't work either
          requires:
            - build-GEOSgcm-on-<< matrix.compiler >>
          repo: GEOSgcm
          #baselibs_version: *baselibs_version
          #bcs_version: *bcs_version
          gcm_ocean_type: MOM6
          change_layout: false
